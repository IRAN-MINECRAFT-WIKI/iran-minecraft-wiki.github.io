<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MineBed | مرجع فارسی ماینکرفت</title>
<meta name="robots" content="index, follow">
<meta name="description" content="مرجع فارسی ماینکرفت بدراک — دانلود ماد، مپ، ریسورس‌پک، سید، آموزش و ویکی.">
<!-- Smart root redirect: if a user lands on the bare root user-page, send them to
     /website/ where the actual MineBed Astro site lives. But if they hit a deep
     path like /blog/foo from an old link, 404.html handles that (this file only
     handles the bare root and explicit / paths). -->
<script>
(function () {
  var p = window.location.pathname;
  var q = window.location.search || '';
  var h = window.location.hash || '';

  // Bare root or explicit /index.html → /website/
  if (p === '/' || p === '/index.html') {
    window.location.replace('/website/' + q + h);
    return;
  }

  // Anything else → also forward to /website/ + original path (deep-link safe)
  if (p.indexOf('/website/') !== 0 && p !== '/website') {
    var newPath = '/website' + (p.charAt(0) === '/' ? p : '/' + p);
    window.location.replace(newPath + q + h);
    return;
  }

  // Already on /website/*, do nothing.
})();
</script>
<noscript>
  <meta http-equiv="refresh" content="3; url=/website/">
</noscript>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Vazirmatn', system-ui, sans-serif;
    background: radial-gradient(ellipse at 50% 0%, #17331b 0%, #0d0d18 70%);
    color: #e6e6f2;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    text-align: center;
    padding: 20px;
    overflow: hidden;
  }
  .box {
    max-width: 420px;
    padding: 40px 30px;
    background: rgba(28,28,52,0.85);
    border: 3px solid #2e2e4a;
    box-shadow: 0 20px 60px rgba(0,0,0,0.6);
    position: relative;
    z-index: 2;
  }
  .logo {
    font-family: 'Press Start 2P', monospace;
    font-size: 14px;
    color: #5fa838;
    text-shadow: 0 0 15px rgba(95,168,56,0.6);
    letter-spacing: 2px;
    margin-bottom: 24px;
  }
  .icon { font-size: 48px; margin-bottom: 16px; display: block; animation: bounce 1s infinite; }
  @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
  h1 { font-size: 20px; color: #fff; margin-bottom: 12px; }
  p { color: #9a9ab8; margin-bottom: 20px; font-size: 14px; line-height: 1.7; }
  .countdown {
    font-family: 'Press Start 2P', monospace;
    font-size: 36px;
    color: #4aedd9;
    text-shadow: 0 0 30px rgba(74,237,217,0.6), 3px 3px 0 #000;
    margin: 20px 0;
    display: block;
  }
  .bar { width: 100%; height: 8px; background: #14142a; border: 2px solid #2e2e4a; overflow: hidden; margin-top: 16px; }
  .bar-fill { height: 100%; width: 0; background: linear-gradient(90deg, #3d7521, #7cc84a); animation: fillBar 3s linear forwards; }
  @keyframes fillBar { 0% { width: 0; } 100% { width: 100%; } }
  a {
    display: inline-block;
    margin-top: 22px;
    padding: 12px 24px;
    background: #5fa838;
    color: #fff;
    text-decoration: none;
    font-weight: 700;
    font-size: 13.5px;
    border: 3px solid;
    border-color: #7cc84a #3d7521 #3d7521 #7cc84a;
    box-shadow: 0 4px 0 rgba(0,0,0,0.45);
    transition: all 0.1s;
  }
  a:hover { background: #7cc84a; }
</style>
</head>
<body>
  <div class="box">
    <div class="logo">MINEBED</div>
    <span class="icon">⛏️</span>
    <h1>در حال انتقال به وب‌سایت...</h1>
    <p>صفحه‌ای که دنبالش بودید به آدرس جدید منتقل شده. اگه به‌صورت خودکار منتقل نشدید، روی دکمه زیر بزنید:</p>
    <span class="countdown" id="countdown">3</span>
    <div class="bar"><div class="bar-fill"></div></div>
    <a href="/website/">ورود به وب‌سایت</a>
  </div>
  <script>
    // Countdown display (3-2-1) for visual feedback
    var cd = document.getElementById('countdown');
    var n = 3;
    var t = setInterval(function () {
      n--;
      if (cd) cd.textContent = n > 0 ? n : '0';
      if (n <= 0) { clearInterval(t); }
    }, 1000);
  </script>
</body>
</html>
