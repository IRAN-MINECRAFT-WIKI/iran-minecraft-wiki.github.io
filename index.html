<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MineBed | در حال انتقال...</title>
<meta http-equiv="refresh" content="3; url=/website/">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Vazirmatn', system-ui, sans-serif;
    background: radial-gradient(ellipse at 50% 0%, #17331b 0%, #0d0d18 70%);
    color: #e6e6f2;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    text-align: center;
    padding: 20px;
    overflow: hidden;
  }
  .box {
    max-width: 420px;
    padding: 40px 30px;
    background: rgba(28,28,52,0.85);
    border: 3px solid #2e2e4a;
    box-shadow: 0 20px 60px rgba(0,0,0,0.6);
    position: relative;
    z-index: 2;
  }
  .logo {
    font-family: 'Press Start 2P', monospace;
    font-size: 14px;
    color: #5fa838;
    text-shadow: 0 0 15px rgba(95,168,56,0.6);
    letter-spacing: 2px;
    margin-bottom: 24px;
  }
  .icon {
    font-size: 48px;
    margin-bottom: 16px;
    display: block;
    animation: bounce 1s infinite;
  }
  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }
  h1 {
    font-size: 20px;
    color: #fff;
    margin-bottom: 12px;
  }
  p {
    color: #9a9ab8;
    margin-bottom: 20px;
    font-size: 14px;
  }
  .countdown {
    font-family: 'Press Start 2P', monospace;
    font-size: 36px;
    color: #4aedd9;
    text-shadow: 0 0 30px rgba(74,237,217,0.6), 3px 3px 0 #000;
    margin: 20px 0;
    display: block;
  }
  .bar {
    width: 100%;
    height: 8px;
    background: #14142a;
    border: 2px solid #2e2e4a;
    overflow: hidden;
    margin-top: 16px;
  }
  .bar-fill {
    height: 100%;
    width: 0;
    background: linear-gradient(90deg, #3d7521, #7cc84a);
    animation: fillBar 3s linear forwards;
  }
  @keyframes fillBar {
    0% { width: 0; }
    100% { width: 100%; }
  }
  a {
    display: inline-block;
    margin-top: 22px;
    padding: 12px 24px;
    background: #5fa838;
    color: #fff;
    text-decoration: none;
    font-weight: 700;
    font-size: 13.5px;
    border: 3px solid;
    border-color: #7cc84a #3d7521 #3d7521 #7cc84a;
    box-shadow: 0 4px 0 rgba(0,0,0,0.45);
    transition: all 0.1s;
  }
  a:hover { background: #7cc84a; }
  a:active { transform: translateY(4px); box-shadow: none; }
  /* بلوک‌های شناور پس‌زمینه */
  .blk {
    position: fixed;
    width: 24px;
    height: 24px;
    background: linear-gradient(180deg, #6db73f 0 30%, #79553a 30% 100%);
    border: 2px solid #2b1d0e;
    opacity: 0.15;
    animation: floatUp linear infinite;
    z-index: 1;
  }
  @keyframes floatUp {
    0% { transform: translateY(110vh) rotate(0deg); }
    100% { transform: translateY(-20vh) rotate(360deg); }
  }
</style>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>

<!-- بلوک‌های شناور -->
<div class="blk" style="left:10%; animation-duration:12s;"></div>
<div class="blk" style="left:25%; animation-duration:15s; animation-delay:2s;"></div>
<div class="blk" style="left:50%; animation-duration:10s; animation-delay:1s;"></div>
<div class="blk" style="left:70%; animation-duration:14s; animation-delay:3s;"></div>
<div class="blk" style="left:85%; animation-duration:11s; animation-delay:0.5s;"></div>
<div class="blk" style="left:40%; animation-duration:13s; animation-delay:4s;"></div>

<div class="box">
  <div class="logo">MINEBED</div>
  <span class="icon">⛏️</span>
  <h1>در حال انتقال به سایت...</h1>
  <p>لطفاً چند لحظه صبر کن</p>
  <span class="countdown" id="countdown">3</span>
  <div class="bar"><div class="bar-fill"></div></div>
  <a href="/website/">اگه خودکار منتقل نشدی، اینجا کلیک کن</a>
</div>

<script>
  let count = 3;
  const cd = document.getElementById('countdown');
  const timer = setInterval(() => {
    count--;
    if (count > 0) {
      cd.textContent = count;
    } else {
      clearInterval(timer);
      cd.textContent = '✓';
    }
  }, 1000);
</script>

</body>
</html>
