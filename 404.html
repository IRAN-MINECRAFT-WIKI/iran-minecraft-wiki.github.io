<!DOCTYPE html>

<title>در حال انتقال... | MineBed</title>
<meta name="robots" content="noindex, follow">
<!-- Smart redirect: GitHub Pages serves this 404.html when a visitor hits an old
     root-level URL like /blog/foo (without /website/ prefix). We transparently
     rewrite the URL to /website/blog/foo so the user lands on the real page. -->
<script>
(function () {
  var p = window.location.pathname;
  var q = window.location.search || '';
  var h = window.location.hash || '';

  // Skip the redirect page itself and the /website/ subtree (already correct).
  if (p === '/' || p === '/index.html' || p === '/404.html') {
    window.location.replace('/website/' + q + h);
    return;
  }

  // If path doesn't already start with /website/, prepend it.
  if (p.indexOf('/website/') !== 0 && p !== '/website') {
    var newPath = '/website' + (p.charAt(0) === '/' ? p : '/' + p);
    window.location.replace(newPath + q + h);
    return;
  }

  // Already on /website/* — go to homepage.
  window.location.replace('/website/' + q + h);
})();
</script>
